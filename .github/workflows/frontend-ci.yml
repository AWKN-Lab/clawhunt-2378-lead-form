name: Frontend CI

# 单包前端仓：push 到 main 与 PR 都跑 lint / 类型检查 / 组件测试 / 构建。
# Node 20 已 EOL（2026-04-30），Actions 也已移除 Node 20 运行时，固定用 Node 24。
# Action 均 pin 到 SHA，不用浮动 tag。
on:
  push:
    branches: [main]
  pull_request:

# 只读权限：作业只读源码、不写仓库、不打印环境变量。
permissions:
  contents: read

# 同分支新提交取消旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npx vitest run
      - name: build
        run: npm run build
      - name: 上传 dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist
          retention-days: 7
